<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Trading Portal</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #12161c;
      --card-bg: #1e2329;
      --text-main: #ffffff;
      --text-muted: #848e9c;
      --accent-color: #f0b90b;
      --accent-hover: #e0ac07;
      --border-color: #2b313a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Feature Highlights */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      text-align: center;
      margin-top: 10px;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      background-color: #2b2f36;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .feature-icon svg {
      width: 22px;
      height: 22px;
      fill: var(--accent-color);
    }

    .feature-title {
      font-weight: 600;
      font-size: 16px;
    }

    .feature-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Notice Card */
    .notice-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      background-color: var(--accent-color);
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .notice-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notice-title {
      font-weight: 600;
      color: var(--accent-color);
      font-size: 15px;
    }

    .notice-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .notice-text strong {
      color: var(--text-main);
    }

    /* Primary Action Button */
    .action-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .action-btn:active {
      background-color: var(--accent-hover);
    }

    .btn-subtext {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: -12px;
    }

    /* Footer Section */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 20px;
    }

    .footer-powered {
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-country {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .flag-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Key Features -->
    <div class="features-list">
      <!-- Secure Feature -->
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
        </div>
        <div class="feature-title">Secure</div>
        <div class="feature-desc">Protected trades with escrow</div>
      </div>

      <!-- Community Feature -->
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <div class="feature-title">Community</div>
        <div class="feature-desc">Verified members only</div>
      </div>

      <!-- Fast Feature -->
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
        </div>
        <div class="feature-title">Fast</div>
        <div class="feature-desc">Instant peer-to-peer trades</div>
      </div>
    </div>

    <!-- Membership Notice Box -->
    <div class="notice-card">
      <div class="check-icon">✓</div>
      <div class="notice-content">
        <div class="notice-title">Membership Access</div>
        <div class="notice-text">
          Exclusive to registered community members with verified accounts.
        </div>
      </div>
    </div>

    <!-- Action Button -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button class="action-btn" id="startBtn">
        Get Started &rarr;
      </button>
      <div class="btn-subtext">Complete registration to start trading</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-powered">Powered by Blockchain Liberty Foundation</div>
    <div class="footer-country">
      <span class="flag-icon">🇪🇹</span>
      <span>Ethiopia</span>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Expand mini app to full height
    }

    // Button click action
    document.getElementById('startBtn').addEventListener('click', () => {
      if (tg && tg.sendData) {
        // Send data back to the Telegram Bot
        tg.sendData(JSON.stringify({ action: "start_registration" }));
      } else {
        alert("Action triggered: Get Started");
      }
    });
  </script>
</body>
</html>
